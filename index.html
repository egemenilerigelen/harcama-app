<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>Harcama</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app">
  <!-- SABİT KALAN ÜST PANEL -->
  <div class="fixed-top">
    <section class="totals">
      <div><small>BUGÜN</small><b id="sToday">₺0</b></div>
      <div><small>BU AY</small><b id="sMonth">₺0</b></div>
    </section>

    <section class="panel">
      <input id="name" type="text" placeholder="Ne aldın?" maxlength="60" autocomplete="off">
      
      <!-- TAKSİT SEÇİM ŞERİDİ -->
      <div class="inst-selector" id="instSelector">
        <button class="inst-btn active" data-inst="1">Tek Çekim</button>
        <button class="inst-btn" data-inst="2">2x</button>
        <button class="inst-btn" data-inst="3">3x</button>
        <button class="inst-btn" data-inst="6">6x</button>
        <button class="inst-btn" data-inst="12">12x</button>
      </div>

      <div class="display">
        <span class="cur">₺</span>
        <span class="amt" id="amt"></span>
        <button id="back" aria-label="Sil">⌫</button>
      </div>
      <div class="pad" id="pad"></div>
    </section>
  </div>

  <!-- YÜKSEKLİĞİ SABİTLENMİŞ KAYDIRILABİLİR LİSTE -->
  <section id="list"></section>

  <!-- SABİT SIL BUTONU -->
  <section class="tools">
    <button id="clear">Tümünü sil</button>
  </section>
</main>

<script src="js/storage.js"></script>
<script src="js/calc.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
